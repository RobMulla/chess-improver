[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py312"

# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["B011"]      # Allow assert False in tests

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]  # Skip assert_used and shell_true in tests

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"

[tool.djlint]
profile = "jinja"
extension = "html"
indent = 4
blank_line_after_tag = "load,extends,include"
# H006: Img tag should have alt (sometimes hard in templates)
# H030, H031: Meta tag validation
# H021: Inline styles (used heavily in prototype)
# H025: Orphan tags (sometimes template inheritance confuses this)
# T003: Endblock should have name (preference, not required)
# T028: Spaceless tags suggestion
ignore = "H006,H030,H031,H021,J018,H025,T003,T028"
